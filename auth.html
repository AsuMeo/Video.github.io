<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VK Meow — Вход</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = {
          apiKey: "AIzaSyDQMqwnJp34H6I7ragLr14LQ4YszpDFYbg",
          authDomain: "meowmessenger.firebaseapp.com",
          databaseURL: "https://meowmessenger-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "meowmessenger",
          storageBucket: "meowmessenger.firebasestorage.app",
          messagingSenderId: "906512822162",
          appId: "1:906512822162:web:a868af851cec5a3381db4b"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.fbAuth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut };
    </script>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-bar: #0A0A0C;
            --accent: #1F80E0;
            --text-muted: #8E8E93;
            --text-white: #F2F2F7;
            --error: #FF3B30;
            --success: #34C759;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-white); height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .auth-card {
            width: 90%;
            max-width: 380px;
            background: #161618;
            padding: 32px 24px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .auth-logo {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
        }
        .auth-logo svg { color: var(--accent); }
        .auth-title { font-size: 24px; margin-bottom: 6px; font-weight: 800; }
        .auth-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
        .auth-input {
            width: 100%;
            height: 44px;
            border-radius: 12px;
            border: 1px solid #2C2C2E;
            background: #1C1C1E;
            color: white;
            padding: 0 16px;
            outline: none;
            font-size: 15px;
            margin-bottom: 12px;
            user-select: text;
        }
        .auth-input:focus { border-color: var(--accent); }
        .auth-btn {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.15s;
        }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-btn:active:not(:disabled) { transform: scale(0.98); }
        .auth-btn.secondary { background: #2C2C2E; margin-top: 8px; }
        .auth-error { color: var(--error); margin-top: 15px; font-size: 13px; display: none; }
        .auth-logs {
            margin-top: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .auth-logs-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .log-entry {
            font-size: 12px;
            padding: 3px 0;
            font-family: "SF Mono", Consolas, monospace;
            line-height: 1.4;
        }
        .log-entry.info { color: var(--text-muted); }
        .log-entry.success { color: var(--success); }
        .log-entry.error { color: var(--error); }
        .log-entry.process { color: var(--accent); }
        .log-time { opacity: 0.5; margin-right: 6px; }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function getTime() {
            const now = new Date();
            return now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function AuthApp() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [logs, setLogs] = useState([]);
            const logsEndRef = useRef(null);

            const addLog = (type, message) => {
                setLogs(prev => [...prev, { type, message, time: getTime() }]);
            };

            useEffect(() => {
                if (logsEndRef.current) {
                    logsEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [logs]);

            useEffect(() => {
                addLog('info', 'Страница авторизации загружена');
                addLog('info', 'Ожидание ввода данных...');

                const checkAuth = setInterval(() => {
                    if (window.fbAuth && window.fbAuth.auth) {
                        clearInterval(checkAuth);
                        addLog('success', 'Firebase Auth инициализирован');

                        window.fbAuth.onAuthStateChanged(window.fbAuth.auth, (user) => {
                            if (user) {
                                addLog('success', `Пользователь уже авторизован: ${user.email}`);
                                addLog('process', 'Перенаправление в мессенджер...');
                                setTimeout(() => {
                                    window.location.href = 'index.html';
                                }, 800);
                            } else {
                                addLog('info', 'Пользователь не авторизован');
                            }
                        });
                    }
                }, 100);

                return () => clearInterval(checkAuth);
            }, []);

            const handleAuth = async (isRegister) => {
                if (!email.trim() || !password.trim()) {
                    setError('Заполните все поля!');
                    addLog('error', 'Попытка входа с пустыми полями');
                    return;
                }

                setLoading(true);
                setError('');
                const action = isRegister ? 'Регистрация' : 'Вход';
                addLog('process', `${action}: отправка запроса...`);
                addLog('info', `Email: ${email}`);

                try {
                    if (isRegister) {
                        addLog('process', 'Создание нового аккаунта...');
                        await window.fbAuth.createUserWithEmailAndPassword(window.fbAuth.auth, email, password);
                        addLog('success', 'Аккаунт успешно создан!');
                        addLog('process', 'Автоматический вход...');
                    } else {
                        addLog('process', 'Попытка входа...');
                        await window.fbAuth.signInWithEmailAndPassword(window.fbAuth.auth, email, password);
                        addLog('success', 'Вход выполнен успешно!');
                    }

                    addLog('success', 'Авторизация пройдена ✓');
                    addLog('process', 'Перенаправление в мессенджер...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } catch (err) {
                    let errMsg = err.message;
                    if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-email') {
                        if (!isRegister) {
                            addLog('error', 'Пользователь не найден, пробуем создать аккаунт...');
                            try {
                                addLog('process', 'Регистрация нового пользователя...');
                                await window.fbAuth.createUserWithEmailAndPassword(window.fbAuth.auth, email, password);
                                addLog('success', 'Аккаунт создан и вход выполнен!');
                                addLog('process', 'Перенаправление в мессенджер...');
                                setTimeout(() => {
                                    window.location.href = 'index.html';
                                }, 1000);
                                setLoading(false);
                                return;
                            } catch (regErr) {
                                errMsg = regErr.message;
                                addLog('error', `Ошибка регистрации: ${regErr.code}`);
                            }
                        } else {
                            addLog('error', `Ошибка: ${err.code}`);
                        }
                    } else if (err.code === 'auth/email-already-in-use') {
                        addLog('error', 'Email уже используется');
                    } else if (err.code === 'auth/weak-password') {
                        addLog('error', 'Слишком простой пароль');
                    } else {
                        addLog('error', `Ошибка: ${err.code || 'unknown'}`);
                    }
                    setError(errMsg);
                    setLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') handleAuth(false);
            };

            return (
                <div className="auth-card">
                    <div className="auth-logo">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="60" height="60">
                            <path d="M12 14c-1.66 0-3 1.34-3 3 0 2 2 3.5 3 3.5s3-1.5 3-3.5c0-1.66-1.34-3-3-3zm-4.5-3c-.83 0-1.5.67-1.5 1.5s.5 2 1.5 2 1.5-1 1.5-2-.67-1.5-1.5-1.5zm9 0c-.83 0-1.5.67-1.5 1.5s.5 2 1.5 2 1.5-1 1.5-2-.67-1.5-1.5-1.5zm-11-4C5.17 7 4.5 7.67 4.5 8.5S5 10.5 6 10.5s1.5-1 1.5-2-.67-1.5-1.5-1.5zm13 0c-.83 0-1.5.67-1.5 1.5s.5 2 1.5 2 1.5-1 1.5-2-.67-1.5-1.5-1.5z"/>
                        </svg>
                    </div>
                    <h1 className="auth-title">VK Meow</h1>
                    <p className="auth-subtitle">Безопасный мессенджер нового поколения</p>

                    <input 
                        type="email" 
                        className="auth-input" 
                        placeholder="Электронная почта"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        onKeyDown={handleKeyDown}
                        disabled={loading}
                    />
                    <input 
                        type="password" 
                        className="auth-input" 
                        placeholder="Пароль"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        onKeyDown={handleKeyDown}
                        disabled={loading}
                    />

                    <button 
                        className="auth-btn" 
                        onClick={() => handleAuth(false)}
                        disabled={loading}
                    >
                        {loading ? <div className="spinner"></div> : null}
                        {loading ? 'Вход...' : 'Войти / Создать аккаунт'}
                    </button>

                    {error && <div className="auth-error" style={{display: 'block'}}>{error}</div>}

                    <div className="auth-logs">
                        <div className="auth-logs-title">📋 Логи</div>
                        {logs.map((log, i) => (
                            <div key={i} className={`log-entry ${log.type}`}>
                                <span className="log-time">[{log.time}]</span>
                                {log.message}
                            </div>
                        ))}
                        <div ref={logsEndRef} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthApp />);
    </script>
</body>
</html>
