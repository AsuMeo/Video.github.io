<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemo",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.firebaseAuth = auth;
        window.firebaseCreateUser = createUserWithEmailAndPassword;
        window.firebaseSignIn = signInWithEmailAndPassword;
        window.firebaseOnAuthStateChanged = onAuthStateChanged;
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .auth-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            border: none;
            background: transparent;
            color: #a0a0a0;
            font-size: 1rem;
        }
        .tab.active {
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            color: #fff;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #c0c0c0;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            color: #fff;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .success-msg {
            background: rgba(46, 213, 115, 0.15);
            border: 1px solid rgba(46, 213, 115, 0.3);
            color: #2ed573;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .logs-container {
            margin-top: 25px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .logs-header {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .log-time {
            color: #666;
            font-size: 0.75rem;
            white-space: nowrap;
        }
        .log-info { color: #4dabf7; }
        .log-success { color: #2ed573; }
        .log-error { color: #ff6b6b; }
        .log-warn { color: #fcc419; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-link:hover { color: #e94560; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function AuthApp() {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);
            const [logs, setLogs] = useState([]);
            const logsEndRef = useRef(null);

            const addLog = (text, type = 'info') => {
                const now = new Date();
                const time = now.toLocaleTimeString('ru-RU', { hour12: false }) + '.' + String(now.getMilliseconds()).padStart(3, '0');
                setLogs(prev => [...prev, { time, text, type }]);
            };

            useEffect(() => {
                logsEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            useEffect(() => {
                addLog('Компонент авторизации загружен', 'info');
                addLog('Ожидание действия пользователя...', 'info');

                if (window.firebaseOnAuthStateChanged && window.firebaseAuth) {
                    window.firebaseOnAuthStateChanged(window.firebaseAuth, (user) => {
                        if (user) {
                            addLog(`Обнаружена активная сессия: ${user.email}`, 'success');
                            setTimeout(() => {
                                addLog('Перенаправление на главную страницу...', 'info');
                                window.location.href = 'main.html';
                            }, 1500);
                        } else {
                            addLog('Активная сессия не найдена', 'warn');
                        }
                    });
                }
            }, []);

            const validate = () => {
                if (!email.trim()) {
                    addLog('Ошибка: email не указан', 'error');
                    setMessage({ text: 'Введите email', type: 'error' });
                    return false;
                }
                if (!password.trim()) {
                    addLog('Ошибка: пароль не указан', 'error');
                    setMessage({ text: 'Введите пароль', type: 'error' });
                    return false;
                }
                if (mode === 'register') {
                    if (password.length < 6) {
                        addLog('Ошибка: пароль менее 6 символов', 'error');
                        setMessage({ text: 'Пароль должен быть не менее 6 символов', type: 'error' });
                        return false;
                    }
                    if (password !== confirmPassword) {
                        addLog('Ошибка: пароли не совпадают', 'error');
                        setMessage({ text: 'Пароли не совпадают', type: 'error' });
                        return false;
                    }
                }
                return true;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage(null);

                if (!validate()) return;

                setLoading(true);
                const action = mode === 'login' ? 'Вход' : 'Регистрация';
                addLog(`${action}: начинаю процесс...`, 'info');
                addLog(`Email: ${email}`, 'info');

                try {
                    if (mode === 'login') {
                        addLog('Отправка запроса на вход в Firebase...', 'info');
                        const result = await window.firebaseSignIn(window.firebaseAuth, email, password);
                        addLog('Ответ от Firebase получен', 'info');
                        addLog(`Успешный вход! UID: ${result.user.uid}`, 'success');
                        addLog(`Пользователь: ${result.user.email}`, 'success');
                        setMessage({ text: 'Вход выполнен успешно! Перенаправление...', type: 'success' });
                        setTimeout(() => {
                            window.location.href = 'main.html';
                        }, 1500);
                    } else {
                        addLog('Отправка запроса на регистрацию в Firebase...', 'info');
                        const result = await window.firebaseCreateUser(window.firebaseAuth, email, password);
                        addLog('Ответ от Firebase получен', 'info');
                        addLog(`Регистрация успешна! UID: ${result.user.uid}`, 'success');
                        addLog(`Создан пользователь: ${result.user.email}`, 'success');
                        setMessage({ text: 'Регистрация успешна! Перенаправление...', type: 'success' });
                        setTimeout(() => {
                            window.location.href = 'main.html';
                        }, 1500);
                    }
                } catch (err) {
                    addLog(`ОШИБКА: ${err.code}`, 'error');
                    addLog(`Сообщение: ${err.message}`, 'error');
                    let userMsg = 'Произошла ошибка';
                    switch (err.code) {
                        case 'auth/user-not-found':
                            userMsg = 'Пользователь не найден';
                            break;
                        case 'auth/wrong-password':
                            userMsg = 'Неверный пароль';
                            break;
                        case 'auth/invalid-email':
                            userMsg = 'Некорректный email';
                            break;
                        case 'auth/email-already-in-use':
                            userMsg = 'Email уже используется';
                            break;
                        case 'auth/weak-password':
                            userMsg = 'Слишком слабый пароль';
                            break;
                        case 'auth/invalid-credential':
                            userMsg = 'Неверные учетные данные';
                            break;
                        case 'auth/api-key-not-valid':
                            userMsg = 'Ошибка конфигурации Firebase (API Key)';
                            addLog('ВНИМАНИЕ: Нужно настроить Firebase Config!', 'warn');
                            break;
                        default:
                            userMsg = `Ошибка: ${err.message}`;
                    }
                    setMessage({ text: userMsg, type: 'error' });
                } finally {
                    setLoading(false);
                    addLog('Запрос завершен', 'info');
                }
            };

            const switchMode = (newMode) => {
                setMode(newMode);
                setMessage(null);
                setEmail('');
                setPassword('');
                setConfirmPassword('');
                addLog(`Переключение на режим: ${newMode === 'login' ? 'Вход' : 'Регистрация'}`, 'info');
            };

            return (
                <div className="auth-container">
                    <div className="auth-header">
                        <h2>{mode === 'login' ? 'Вход' : 'Регистрация'}</h2>
                    </div>

                    <div className="tabs">
                        <button className={`tab ${mode === 'login' ? 'active' : ''}`} onClick={() => switchMode('login')}>
                            Вход
                        </button>
                        <button className={`tab ${mode === 'register' ? 'active' : ''}`} onClick={() => switchMode('register')}>
                            Регистрация
                        </button>
                    </div>

                    {message && (
                        <div className={message.type === 'success' ? 'success-msg' : 'error-msg'}>
                            {message.text}
                        </div>
                    )}

                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label>Email</label>
                            <input
                                type="email"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                placeholder="your@email.com"
                                disabled={loading}
                            />
                        </div>
                        <div className="form-group">
                            <label>Пароль</label>
                            <input
                                type="password"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                placeholder="••••••••"
                                disabled={loading}
                            />
                        </div>
                        {mode === 'register' && (
                            <div className="form-group">
                                <label>Подтвердите пароль</label>
                                <input
                                    type="password"
                                    value={confirmPassword}
                                    onChange={(e) => setConfirmPassword(e.target.value)}
                                    placeholder="••••••••"
                                    disabled={loading}
                                />
                            </div>
                        )}
                        <button type="submit" className="btn-submit" disabled={loading}>
                            {loading ? 'Загрузка...' : (mode === 'login' ? 'Войти' : 'Зарегистрироваться')}
                        </button>
                    </form>

                    <a href="index.html" className="back-link">← На главную</a>

                    <div className="logs-container">
                        <div className="logs-header">Логи ({logs.length})</div>
                        {logs.map((log, i) => (
                            <div key={i} className={`log-entry log-${log.type}`}>
                                <span className="log-time">[{log.time}]</span>
                                <span>{log.text}</span>
                            </div>
                        ))}
                        <div ref={logsEndRef} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthApp />);
    </script>
</body>
</html>
